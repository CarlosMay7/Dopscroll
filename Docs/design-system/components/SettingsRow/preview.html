<!-- @dsCard group="Settings" height=300 subtitle="AddSettingsSection / SettingsRow (Menus.cs)" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../bundle.css"><title>SettingsRow</title></head>
<body>
<div class="g-app" style="flex-direction:column;align-items:stretch;max-width:460px;gap:10px">
  <span style="font-family:var(--font-display,'Bungee',sans-serif);font-size:14px;color:var(--app-muted,#5c5680)">COMFORT</span>
  <div style="background:#ffffff;border:3px solid var(--ink,#0e0b1f);border-radius:var(--radius-panel,18px);padding:12px 16px;display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;gap:12px;align-items:center"><span style="flex:1;display:flex;flex-direction:column"><b style="font-weight:900;font-size:18px">Reduced motion</b><span style="font-size:14px;color:var(--app-muted,#5c5680)">No shaking, flying numbers or pulsing.</span></span><span class="g-sticker g-btn g-app-off" style="font-size:15px;min-width:76px">OFF</span></div>
    <div style="display:flex;gap:12px;align-items:center"><span style="flex:1;display:flex;flex-direction:column"><b style="font-weight:900;font-size:18px">First-time tips</b><span style="font-size:14px;color:var(--app-muted,#5c5680)">Post-its that explain the battery, outlet, blur, boredom and boss once.</span></span><span class="g-sticker g-btn" style="background:var(--cash,#b8ff3c);font-size:15px;min-width:76px">ON</span></div>
    <div style="display:flex;gap:12px;align-items:center"><b style="font-weight:900;font-size:18px;flex:1">Music</b><span style="font-family:var(--font-display,'Bungee',sans-serif);font-size:15px">80%</span></div>
    <span style="position:relative;display:block;height:12px;border:3px solid var(--ink,#0e0b1f);border-radius:8px;background:var(--app-line,#e3def5)"><span style="display:block;width:80%;height:100%;background:var(--dopamine,#ff3d81);border-radius:6px 0 0 6px"></span><span style="position:absolute;left:calc(80% - 15px);top:-12px;width:30px;height:30px;border-radius:50%;background:#ffffff;border:3px solid var(--ink,#0e0b1f);box-sizing:border-box"></span></span>
  </div>
</div>
</body>
</html>
