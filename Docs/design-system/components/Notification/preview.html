<!-- @dsCard group="Lock screen" height=230 subtitle="AddNotification (Menus.cs)" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../bundle.css"><title>Notification</title></head>
<body>
<div class="g-lock" style="flex-direction:column;align-items:stretch;max-width:480px">
  <div style="display:flex;gap:12px;align-items:flex-start;background:rgba(255,255,255,var(--bubble,.92));color:var(--ink,#0e0b1f);border-radius:var(--radius-bubble,22px);padding:12px 14px">
    <span class="g-sticker" style="background:var(--dopamine,#ff3d81);width:41px;height:41px;border-width:2px;border-radius:11px;box-shadow:none;font-family:var(--font-display,'Bungee',sans-serif);font-size:19px">M</span>
    <span style="flex:1;display:flex;flex-direction:column"><span style="display:flex;font-size:16px"><b style="font-weight:900;flex:1">Mom</b><span style="color:var(--app-muted,#5c5680)">now</span></span><span style="font-size:18px">i saw you online at 4am</span></span>
  </div>
  <div style="display:flex;gap:12px;align-items:flex-start;background:rgba(255,255,255,var(--bubble,.92));color:var(--ink,#0e0b1f);border-radius:var(--radius-bubble,22px);padding:12px 14px">
    <span class="g-sticker" style="background:var(--eyes,#3ce6ff);width:41px;height:41px;border-width:3px;border-radius:11px;box-shadow:none"><img src="../../assets/Icons/clock.svg" alt="" style="width:22px;height:22px"></span>
    <span style="flex:1;display:flex;flex-direction:column"><span style="display:flex;font-size:16px"><b style="font-weight:900;flex:1">Screen Time</b><span style="color:var(--app-muted,#5c5680)">1h</span></span><span style="font-size:18px">639 videos so far. That is 0h 31m of your life.</span></span>
  </div>
</div>
</body>
</html>
