<!-- @dsCard group="Actions" height=150 subtitle="GlowStyle.StyleStickerButton" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../bundle.css"><title>StickerButton</title></head>
<body>
<div class="g-night">
  <span class="g-sticker g-btn">PLUG IN [C]</span>
  <span class="g-sticker g-btn" style="background:var(--eyes,#3ce6ff)">CHARGING [C]</span>
  <span class="g-sticker g-btn" style="background:var(--danger,#ff4d4d)">RESET BREAKER [UP]</span>
  <span class="g-sticker g-btn is-pressed">BRIGHT: NORMAL</span>
  <span class="g-sticker g-btn is-disabled">REPLY TO BOSS [UP]</span>
  <span class="g-sticker g-cta" style="background:var(--dopamine,#ff3d81);width:420px;font-size:26px;border-radius:var(--radius-bubble,22px);box-shadow:var(--shadow-sticker-lift,0 6px 0 0 #0e0b1f)">SWIPE UP TO SCROLL</span>
  <div class="g-cap">Paper (default) · eyes = on · danger · pressed · disabled on the desk · the lock-screen CTA</div>
</div>
</body>
</html>
