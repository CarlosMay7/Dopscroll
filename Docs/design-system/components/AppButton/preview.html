<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../bundle.css"><title>AppButton</title></head>
<body>
<div class="g-cream" style="flex-direction:column;align-items:stretch;max-width:520px">
  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <span class="g-sticker g-price" style="background:var(--dopamine,#ff3d81)">185.3</span>
    <span class="g-sticker g-price" style="background:var(--cash,#b8ff3c)">$110.5</span>
    <span class="g-sticker g-price" style="background:var(--grass,#5dcb6e)">2 GP</span>
    <span class="g-sticker g-price" style="background:var(--cash,#b8ff3c)">FREE</span>
    <span class="g-sticker g-price g-app-off">MAX</span>
    <span class="g-sticker g-price g-app-off">READY</span>
  </div>
  <span class="g-sticker g-cta" style="background:var(--mythic,#ffd23c)">OPEN THE SHOP</span>
  <span class="g-sticker g-cta" style="background:var(--eyes,#3ce6ff)">START NIGHT 6</span>
  <span class="g-sticker g-cta g-app-off" style="font-size:22px">POWER CUT · TOUCH GRASS</span>
</div>
</body>
</html>
