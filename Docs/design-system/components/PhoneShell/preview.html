<!-- @dsCard group="Surfaces" height=420 subtitle="BuildPhoneShell (Menus.cs)" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../bundle.css"><title>PhoneShell</title></head>
<body>
<div class="g-night" style="justify-content:center">
  <div style="width:252px;height:504px;background:var(--ink,#0e0b1f);border-radius:33px;padding:7px;box-sizing:border-box;box-shadow:var(--shadow-phone-glow,0 0 80px 0 rgba(189,235,255,.2))">
    <div style="height:100%;background:var(--app-paper,#f4f1ff);border-radius:26px;overflow:hidden;padding:30px 12px 14px;box-sizing:border-box;display:flex;flex-direction:column;gap:8px">
      <span style="font-weight:900;font-size:17px">Screen Time</span>
      <span style="font-size:9px;color:var(--app-muted,#5c5680)">Night 5 report · dawn at 6:00 AM</span>
      <span class="g-sticker" style="background:var(--dopamine,#ff3d81);justify-content:flex-start;gap:6px;padding:6px 7px;border-radius:8px;border-width:2px;box-shadow:0 2px 0 0 var(--ink,#0e0b1f);transform:rotate(-1.5deg)"><span style="font-family:var(--font-display,'Bungee',sans-serif);font-size:22px">139</span><span style="font-size:9px;font-weight:900">videos tonight. The algorithm is learning you.</span></span>
      <span style="flex:1;background:#ffffff;border:2px solid var(--ink,#0e0b1f);border-radius:10px"></span>
      <span class="g-sticker" style="background:var(--mythic,#ffd23c);font-family:var(--font-display,'Bungee',sans-serif);font-size:12px;padding:6px;border-radius:8px;border-width:2px;box-shadow:0 2px 0 0 var(--ink,#0e0b1f)">OPEN THE SHOP</span>
    </div>
  </div>
  <div class="g-cap" style="width:auto">Shown at half size: 504 × 1008, body radius 65, screen radius 53, 14px inset, glow</div>
</div>
</body>
</html>
