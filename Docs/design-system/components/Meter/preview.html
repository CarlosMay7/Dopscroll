<!-- @dsCard group="Feedback" height=150 subtitle="StickerPanel + StyleBar" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../bundle.css"><title>Meter</title></head>
<body>
<div class="g-night" style="gap:28px">
  <div class="g-sticker" style="background:var(--eyes,#3ce6ff);flex-direction:column;align-items:stretch;gap:4px;padding:8px 12px;border-radius:var(--radius-chip,12px);transform:rotate(2deg)">
    <span style="font-family:var(--font-display,'Bungee',sans-serif);font-size:16px">EYES 16%</span>
    <span style="display:block;width:166px;height:14px;border:2px solid var(--ink,#0e0b1f);border-radius:7px;background:var(--ink,#0e0b1f);overflow:hidden"><span style="display:block;width:16%;height:100%;background:var(--danger,#ff4d4d)"></span></span>
    <span style="font-family:var(--font-display,'Bungee',sans-serif);font-size:13px">RUB YOUR EYES! -18%</span>
  </div>
  <div class="g-sticker" style="background:var(--fever,#ff8a3d);flex-direction:column;align-items:stretch;gap:4px;padding:8px 12px;border-radius:var(--radius-chip,12px);transform:rotate(-2deg)">
    <span style="font-family:var(--font-display,'Bungee',sans-serif);font-size:16px">OUTLET 55%</span>
    <span style="display:block;width:190px;height:12px;border:2px solid var(--ink,#0e0b1f);border-radius:6px;background:var(--ink,#0e0b1f);overflow:hidden"><span style="display:block;width:55%;height:100%;background:var(--mythic,#ffd23c)"></span></span>
  </div>
  <span style="display:inline-flex;align-items:center;gap:6px;font-family:var(--font-display,'Bungee',sans-serif);font-size:14px;color:var(--eyes,#3ce6ff)"><svg viewBox="0 0 24 24" width="16" height="20" aria-hidden="true"><polygon points="13.5,2 5,13.5 11,13.5 9.5,22 19,10 13,10" style="fill:var(--eyes,#3ce6ff)"/></svg>+45%</span>
  <div class="g-cap">Eyes meter (blur line) · outlet meter (blinks danger at 80%) · battery while charging</div>
</div>
</body>
</html>
