<!-- @dsCard group="Report" height=420 subtitle="Screen Time (Menus.cs)" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../bundle.css"><title>ReportCard</title></head>
<body>
<div class="g-app" style="flex-direction:column;align-items:stretch;max-width:460px">
  <span class="g-sticker" style="background:var(--dopamine,#ff3d81);justify-content:flex-start;gap:14px;padding:12px 14px;border-radius:var(--radius-card,16px);transform:rotate(var(--tilt-card,-1.5deg))"><span style="font-family:var(--font-display,'Bungee',sans-serif);font-size:46px">139</span><span style="font-size:17px;font-weight:900">videos tonight. The algorithm is learning you.</span></span>
  <div style="background:#ffffff;border:3px solid var(--ink,#0e0b1f);border-radius:var(--radius-report,19px);overflow:hidden">
    <div style="display:flex;padding:11px 16px;border-bottom:2px solid var(--app-line,#e3def5);font-size:18px"><span style="flex:1">Videos watched</span><b style="font-weight:900">139</b></div>
    <div style="display:flex;padding:11px 16px;border-bottom:2px solid var(--app-line,#e3def5);font-size:18px"><span style="flex:1">Your feed is now</span><b style="font-weight:900">27% gaming</b></div>
    <div style="display:flex;padding:11px 16px;border-bottom:2px solid var(--app-line,#e3def5);font-size:18px"><span style="flex:1">Salary · 100% attendance</span><b style="font-weight:900;color:var(--app-good,#2e6b12)">+$38</b></div>
    <div style="display:flex;padding:11px 16px;font-size:18px"><span style="flex:1">Electric bill</span><b style="font-weight:900;color:var(--app-bad,#c2271f)">-$98.04</b></div>
  </div>
  <span style="font-size:17px;color:var(--app-muted,#5c5680)">Next bill on night 9. Mythic pity: 245 of 480.</span>
</div>
</body>
</html>
