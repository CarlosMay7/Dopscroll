<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../bundle.css"><title>TipToast</title></head>
<body>
<div class="g-night">
  <div class="g-sticker" style="background:var(--mythic,#ffd23c);display:flex;flex-direction:column;align-items:stretch;gap:4px;width:400px;padding:12px 16px;border-radius:var(--radius-tip,8px);box-shadow:0 5px 0 0 var(--ink,#0e0b1f);transform:rotate(1.5deg)">
    <div style="display:flex;gap:10px;align-items:center">
      <span class="g-sticker g-tile" style="width:34px;height:34px;background:#ffffff"><img src="../../assets/Icons/battery.svg" alt="" style="width:19px;height:19px"></span>
      <span style="font-family:var(--font-display,'Bungee',sans-serif);font-size:17px">PHONE #1 IS DYING</span>
    </div>
    <span style="font-size:17px">Press C or the PLUG IN sticker (left, by the outlet) to charge. The night is longer than one battery. No overclock while plugged in.</span>
    <span style="font-size:13px;text-align:right;opacity:.6">click to dismiss</span>
  </div>
</div>
</body>
</html>
